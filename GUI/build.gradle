import io.github.fvarrui.javapackager.gradle.PackageTask

plugins {
    id 'java'
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.0.13'
    id 'org.beryx.jlink' version '2.25.0'
    id 'io.github.fvarrui.javapackager.plugin' version '1.7.6'
}

group 'homer.database'
version '1.0-SNAPSHOT'

repositories {
    mavenCentral()
    flatDir {
        dirs 'libs'
    }
}

ext {
    junitVersion = '5.8.2'
}

sourceCompatibility = '9'
targetCompatibility = '9'

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

application {
    mainModule = 'homer.database.gui'
    mainClass = 'homer.database.gui.DataBaseApplication'
}

javafx {
    version = '22.0.1'
    modules = ['javafx.controls', 'javafx.fxml']
}

dependencies {
    implementation 'org.openjfx:javafx:22.0.1'
    implementation 'org.openjfx:javafx-base:22.0.1'
    implementation 'org.openjfx:javafx-controls:22.0.1'
    implementation 'org.openjfx:javafx-fxml:22.0.1'
    implementation 'org.openjfx:javafx-graphics:22.0.1'

    implementation name: 'HomerDataBase-backend-1.1.3-WithDependencies'
    implementation name: 'HomerDataBase-convertor-1.0-WithDependencies'
}

test {
    useJUnitPlatform()
}

jlink {
    imageZip = project.file("${buildDir}/distributions/app-${javafx.platform.classifier}.zip")
    options = ['--strip-debug', '--compress', '2', '--no-header-files', '--no-man-pages']
    launcher {
        name = 'HomerDataBase'
    }
}

jlinkZip {
    group = 'distribution'
}

task packageToApp(type: PackageTask, dependsOn: build) {
    mainClass = application.mainClass

    outputDirectory = file("${buildDir}/packaged")
    setAppName("HomerDataBase")
    displayName = "HomerDataBase"
    organizationName = "Homer"
    jreMinVersion = targetCompatibility
//    administratorRequired = true
//    fileAssociations =
//    additionalResources = [ file('file path'), file('folder path'), ... ]
//    platform = "auto"|"linux"|"mac"|"windows"  // Default is "auto"

//    linuxConfig {
//        ...
//    }
    macConfig {
        icnsFile = file("src/main/resources/homer/database/gui/AppIcon/HomerDataBaseIcon.icns")
    }
    winConfig {
        icoFile = file("src/main/resources/homer/database/gui/AppIcon/HomerDataBaseIcon.ico")
        disableRunAfterInstall = false
        removeOldLibs = true
    }
}